<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body { width: 1200px; height: 1200px; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); }
.browser { position: absolute; left: 80px; top: 150px; width: 880px; }
.phone { position: absolute; right: 70px; top: 470px; width: 300px; }
.cap { position: absolute; left: 80px; bottom: 74px; }
.cap small { display: block; font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: .02em; }
.cap b { display: block; font-size: 52px; letter-spacing: -0.03em; margin-top: 6px; }
.cap span { display: block; font-size: 24px; margin-top: 8px; opacity: .75; }
.tag { position: absolute; left: 80px; top: 70px; padding: 8px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 20px; }
.tag i { font-style: normal; opacity: .7; margin-left: 8px; font-weight: 500; }
</style></head><body>
<span class="tag" id="tag"></span>
<div class="browser"><div class="bar"><i></i><i></i><i></i><span></span></div><img id="desk"></div>
<div class="phone"><img id="phone"></div>
<div class="cap"><small id="kind"></small><b id="title"></b><span id="sub"></span></div>
<script>
const SITES = {
  cafe: { bg: '#e9dccb', ink: '#2a1f18', accent: '#9a5a2c', kind: 'CAFE · 원페이지', title: '온기 로스터리', sub: '메뉴판 · 정기배송 요금제 · 오시는 길' },
  pilates: { bg: '#dfe6dc', ink: '#1f2722', accent: '#4f6b58', kind: 'STUDIO · 원페이지', title: '숨 필라테스', sub: '수업·가격 · 체험 예약 폼 · 첫 방문 안내' },
  interior: { bg: '#ece8e2', ink: '#151515', accent: '#8a6a3c', kind: 'REMODELING · 3페이지', title: '결 인테리어', sub: '시공 사례 · 진행 과정 · 무료 견적 신청' },
  app: { bg: '#141833', ink: '#eef1ff', accent: '#2ee6a6', kind: 'APP LAUNCH · 원페이지', title: '모아 가계부 앱', sub: '앱 화면 목업 · 출시 카운트다운 · 사전예약' },
};
const n = new URLSearchParams(location.search).get('name');
const s = SITES[n];
document.body.style.setProperty('--bg', s.bg); document.body.style.setProperty('--ink', s.ink); document.body.style.setProperty('--accent', s.accent);
document.getElementById('desk').src = `../../dist/shots/${n}-desk.png`;
document.getElementById('phone').src = `../../dist/shots/${n}-phone.png`;
document.getElementById('kind').textContent = s.kind;
document.getElementById('title').textContent = s.title;
document.getElementById('sub').textContent = s.sub;
document.getElementById('tag').innerHTML = '포트폴리오 <i>컨셉 샘플</i>';
</script>
</body></html>
