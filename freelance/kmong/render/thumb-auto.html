<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body { width: 652px; height: 488px; overflow: hidden; position: relative; background: radial-gradient(120% 90% at 85% 15%, #1f8a5a 0%, #0f4a33 50%, #0a2e21 100%); color: #fff; }
.text { position: absolute; left: 50px; top: 52px; width: 330px; }
.label { font-size: 15px; font-weight: 700; color: #bff5d6; }
h1 { margin: 10px 0 0; font-size: 42px; line-height: 1.14; letter-spacing: -0.04em; font-weight: 850; }
h1 em { font-style: normal; color: #ffe066; }
p { margin: 14px 0 0; font-size: 15px; line-height: 1.5; color: #cfeadb; }
.chips { position: absolute; left: 50px; bottom: 52px; display: flex; gap: 8px; flex-wrap: wrap; width: 300px; }
.chip { background: rgba(255,255,255,.14); font-size: 14px; }
.files { position: absolute; left: 384px; top: 58px; width: 240px; height: 96px; }
.file { position: absolute; width: 64px; height: 80px; border-radius: 8px; background: #fff; box-shadow: 0 12px 26px rgba(0,0,0,.3); color: #1f7a54; font: 800 12px Pretendard; display: grid; place-items: end center; padding-bottom: 8px; }
.file::before { content: "X"; position: absolute; top: 10px; left: 10px; width: 22px; height: 22px; border-radius: 6px; background: #1f7a54; color: #fff; display: grid; place-items: center; font-size: 13px; }
.f1 { left: 0; top: 8px; transform: rotate(-8deg); } .f2 { left: 84px; top: 0; transform: rotate(3deg); } .f3 { left: 168px; top: 10px; transform: rotate(-3deg); }
.arrow { position: absolute; left: 488px; top: 150px; font-size: 34px; font-weight: 900; color: #ffe066; line-height: 1; }
.result { position: absolute; left: 372px; top: 196px; width: 250px; }
.result img { border-radius: 10px; box-shadow: 0 24px 50px rgba(0,0,0,.4); display: block; width: 100%; }
.badge { position: absolute; right: 50px; bottom: 52px; padding: 8px 14px; border-radius: 12px; background: #ffe066; color: #3b2f00; font-weight: 800; font-size: 15px; }
</style></head><body>
<div class="text"><div class="label">엑셀 업무 자동화</div><h1>매일 하는<br>엑셀 정리,<br><em>클릭 한 번에</em></h1><p>합치기 · 요약표 · 송장 변환을<br>설치 없는 도구로 만들어 드려요</p></div>
<div class="files"><div class="file f1">강남점</div><div class="file f2">홍대점</div><div class="file f3">판교점</div></div>
<div class="arrow">↓</div>
<div class="result"><img src="../../dist/shots/merge-tool-result.png"></div>
<div class="chips"><span class="chip">🔒 파일 외부 전송 없음</span><span class="chip">⚡ 설치 없음</span></div>
<div class="badge">끌어다 놓으면 끝</div>
</body></html>
