name: 테스트 및 배포

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: NOVA SWARM 테스트
        run: npm test
        working-directory: game
      - name: NOVA BLOCKS 테스트
        run: npm test
        working-directory: blocks
      - name: NOVA MERGE 테스트
        run: npm test
        working-directory: merge
      - name: 계산기 테스트
        run: npm test
      - name: 토스 미니앱 테스트
        run: npm test
        working-directory: toss-apps
      # 사이트 구성: / = 게임 모음, /swarm/ = NOVA SWARM, /blocks/ = NOVA BLOCKS, /merge/ = NOVA MERGE, /money/ = 머니셈 계산기
      # 주소는 저장소 Settings → Secrets and variables → Actions → Variables 의 SITE_URL로 바꿀 수 있다
      - name: 게임 모음 첫 화면 빌드
        run: node build.mjs --out=../dist
        working-directory: hub
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://byeongjun33.github.io/NeedManyMoney' }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      - name: NOVA SWARM 빌드
        run: node build.mjs --out=../dist/swarm
        working-directory: game
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://byeongjun33.github.io/NeedManyMoney' }}/swarm
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      - name: NOVA BLOCKS 빌드
        run: node build.mjs --out=../dist/blocks
        working-directory: blocks
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://byeongjun33.github.io/NeedManyMoney' }}/blocks
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      - name: NOVA MERGE 빌드
        run: node build.mjs --out=../dist/merge
        working-directory: merge
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://byeongjun33.github.io/NeedManyMoney' }}/merge
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      - name: 게임 포털 패키지 (CrazyGames·Poki·GameDistribution zip)
        run: |
          (cd game && node build.mjs)
          (cd blocks && node build.mjs)
          (cd merge && node build.mjs)
      - name: 포털 패키지 내려받기용 업로드
        uses: actions/upload-artifact@v4
        with:
          name: nova-portal-kit
          path: |
            game/dist/*.zip
            game/assets/store/*.png
            game/assets/icon-512.png
            blocks/dist/*.zip
            blocks/assets/store/*.png
            blocks/assets/icon-512.png
            merge/dist/*.zip
            merge/assets/store/*.png
            merge/assets/icon-512.png
      - name: 계산기 빌드
        run: node build.mjs --strict --out=dist/money
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://byeongjun33.github.io/NeedManyMoney' }}/money
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          GA_ID: ${{ vars.GA_ID }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages가 꺼져 있으면 여기서 "Pages를 켜라"는 안내와 함께 멈춘다 (README의 배포 1단계)
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
