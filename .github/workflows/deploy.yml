name: 테스트 및 배포

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 게임 테스트
        run: npm test
        working-directory: game
      - name: 계산기 테스트
        run: npm test
      # 사이트 구성: / = NOVA SWARM 게임, /money/ = 머니셈 계산기
      - name: 게임 빌드
        run: node build.mjs --out=../dist
        working-directory: game
        env:
          # 저장소 Settings → Secrets and variables → Actions → Variables 에서 설정
          SITE_URL: ${{ vars.SITE_URL || 'https://byeongjun33.github.io/NeedManyMoney' }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      - name: 게임 포털 패키지 (CrazyGames·Poki·GameDistribution zip)
        run: node build.mjs
        working-directory: game
      - name: 포털 패키지 내려받기용 업로드
        uses: actions/upload-artifact@v4
        with:
          name: nova-swarm-portal-kit
          path: |
            game/dist/*.zip
            game/assets/store/*.png
            game/assets/icon-512.png
      - name: 계산기 빌드
        run: node build.mjs --strict --out=dist/money
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://byeongjun33.github.io/NeedManyMoney' }}/money
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          GA_ID: ${{ vars.GA_ID }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages가 꺼져 있으면 여기서 "Pages를 켜라"는 안내와 함께 멈춘다 (README의 배포 1단계)
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
