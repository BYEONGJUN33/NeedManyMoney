name: 테스트 및 빌드

on:
  push:
  pull_request:
  workflow_dispatch:

# 사이트 배포는 Cloudflare Pages가 저장소를 직접 보고 한다. 여기서는 테스트, 빌드 확인, 포털 zip 만들기만 한다
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: NOVA SWARM 테스트
        run: npm test
        working-directory: game
      - name: NOVA BLOCKS 테스트
        run: npm test
        working-directory: blocks
      - name: NOVA MERGE 테스트
        run: npm test
        working-directory: merge
      - name: 계산기 테스트
        run: npm test
      - name: 토스 미니앱 테스트
        run: npm test
        working-directory: toss-apps
      # 사이트 구성: / = 첫 화면(NOVA LAB), /swarm/ /blocks/ /merge/ = 게임, /money/ = 머니셈 계산기
      # Cloudflare Pages도 같은 명령(node scripts/build-site.mjs)으로 빌드한다
      # 주소는 저장소 Settings → Secrets and variables → Actions → Variables 의 SITE_URL로 바꿀 수 있다
      - name: 사이트 전체 빌드
        run: node scripts/build-site.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          GA_ID: ${{ vars.GA_ID }}
      - name: 게임 포털 패키지 (CrazyGames·Poki·GameDistribution zip)
        run: |
          (cd game && node build.mjs)
          (cd blocks && node build.mjs)
          (cd merge && node build.mjs)
      - name: 포털 패키지 내려받기용 업로드
        uses: actions/upload-artifact@v4
        with:
          name: nova-portal-kit
          path: |
            game/dist/*.zip
            game/assets/store/*.png
            game/assets/icon-512.png
            blocks/dist/*.zip
            blocks/assets/store/*.png
            blocks/assets/icon-512.png
            merge/dist/*.zip
            merge/assets/store/*.png
            merge/assets/icon-512.png
