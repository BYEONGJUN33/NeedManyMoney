<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../style.css">
<style>
  body { overflow: hidden; }
  .art-logo { position: fixed; z-index: 3; display: grid; gap: 6px; }
  .art-logo .logo { font-size: var(--size); margin: 0; }
  .art-logo p { margin: 0; color: #cfe3ff; font-size: calc(var(--size) * 0.22); font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 0 12px rgba(0,0,0,.8); }
  .shade { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
</style></head>
<body>
<canvas id="game"></canvas>
<div class="shade" id="shade"></div>
<div class="art-logo" id="logo"><h1 class="logo">NOVA<span>BLOCKS</span></h1><p id="sub">DRAG · DROP · CLEAR THE LINES</p></div>
<script type="module">
import { BlocksGame, idx, linesAfter } from '../src/logic.js';
import { Renderer } from '../src/render.js';
const q = new URLSearchParams(location.search);
const layout = q.get('layout') || 'land';
const logo = document.getElementById('logo');
const shade = document.getElementById('shade');
const W = innerWidth, H = innerHeight;
const r = new Renderer(document.getElementById('game'));
// 판을 화면 한쪽으로 옮겨 로고 자리를 만든다
if (layout === 'land' || layout === 'og') {
  logo.style.cssText += `left:${W * 0.06}px;top:50%;transform:translateY(-50%);--size:${H * (layout === 'og' ? 0.2 : 0.17)}px;text-align:left`;
  const size = H * 0.86; r.cell = Math.floor(size / 8); r.bx = Math.round(W * 0.95 - r.cell * 8); r.by = Math.round((H - r.cell * 8) / 2);
  shade.style.background = 'linear-gradient(90deg, rgba(7,9,18,.92) 0%, rgba(7,9,18,.5) 38%, rgba(7,9,18,0) 55%)';
  if (layout === 'og') document.getElementById('sub').textContent = 'FREE PUZZLE · 무료 블록 퍼즐';
}
if (layout === 'port') {
  logo.style.cssText += `left:0;right:0;top:${H * 0.06}px;text-align:center;--size:${W * 0.2}px`;
  r.cell = Math.floor(W * 0.88 / 8); r.bx = Math.round((W - r.cell * 8) / 2); r.by = Math.round(H * 0.4);
  shade.style.background = 'linear-gradient(180deg, rgba(7,9,18,.95) 0%, rgba(7,9,18,.4) 30%, rgba(7,9,18,0) 40%)';
}
if (layout === 'square') {
  logo.style.cssText += `left:0;right:0;bottom:${H * 0.06}px;text-align:center;--size:${W * 0.15}px`;
  r.cell = Math.floor(W * 0.8 / 8); r.bx = Math.round((W - r.cell * 8) / 2); r.by = Math.round(H * 0.04);
  shade.style.background = 'linear-gradient(0deg, rgba(7,9,18,.95) 0%, rgba(7,9,18,.4) 30%, rgba(7,9,18,0) 45%)';
}
if (layout === 'bare') logo.remove();
if (layout === 'bare') r.layout();
else r.slots = [0, 1, 2].map(() => ({ x: -999, y: -999, w: 1, h: 1 })); // 트레이는 그리지 않는다

// 보기 좋은 판: 한 줄과 한 칸이 곧 지워지는 장면
const g = new BlocksGame({ seed: 5 });
const pattern = [
  '33330044',
  '35500044',
  '15500220',
  '11007722',
  '16677700',
  '06600555',
  '04400050',
  '44430033',
];
pattern.forEach((row, rr) => [...row].forEach((ch, cc) => { g.cells[idx(rr, cc)] = Number(ch); }));
g.pieces = [{ id: 'i2h', color: 2 }, { id: 'l1', color: 4 }, { id: 't3', color: 6 }];
const lines = linesAfter(g.cells, g.piece(0), 3, 2);
r.drag = { i: 0, x: r.bx + 3 * r.cell, y: r.by + 3.5 * r.cell - r.cell * 0.55, offY: 0, valid: true, r: 3, c: 2, lines };
r.shout('COMBO ×3', '#ff3d7f');
for (let i = 0; i < 4; i += 1) r.burst(r.bx + (1 + i * 2) * r.cell, r.by + 6.5 * r.cell, ['#3df2ff', '#ffd23d', '#ff3d7f', '#7dff6a'][i], 12);
for (let i = 0; i < 8; i += 1) r.draw(g, 1 / 60);
document.body.dataset.ready = '1';
</script>
</body></html>
