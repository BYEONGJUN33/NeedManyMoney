<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메인 페이지 배경화면 장면</title>
<!-- wallpapers.mjs가 ?k=장면&s=wide|tall 로 열어서 캡처한다. 저장소 맨 위를 웹 서버 루트로 쓰고, /money/ 는 머니셈 빌드 -->
<style>
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; }
body { width: var(--w); height: var(--h); position: relative; font-family: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; }
.full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.card { border-radius: 14px; box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); display: block; object-fit: cover; }
/* 기기 틀 */
.browser { position: absolute; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 40px 100px rgba(20, 60, 40, .25), 0 0 0 1px rgba(0,0,0,.06); }
.browser .top { height: 38px; background: #f4f4f5; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #e4e4e7; }
.browser .top i { width: 12px; height: 12px; border-radius: 50%; background: #d4d4d8; }
.browser .top i:nth-child(1) { background: #ff5f57; } .browser .top i:nth-child(2) { background: #febc2e; } .browser .top i:nth-child(3) { background: #28c840; }
.browser .top b { margin-left: 18px; flex: 1; height: 22px; border-radius: 6px; background: #fff; border: 1px solid #e4e4e7; }
.phone { position: absolute; border-radius: 46px; background: #111; padding: 12px; box-shadow: 0 40px 90px rgba(0,0,0,.28); }
.phone .scr { border-radius: 36px; overflow: hidden; background: #fff; position: relative; }
iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }
</style>
</head>
<body>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const K = q.get('k') || 'default';
  const TALL = q.get('s') === 'tall';
  const W = TALL ? 720 : 1600;
  const H = TALL ? 1280 : 900;
  document.body.style.setProperty('--w', `${W}px`);
  document.body.style.setProperty('--h', `${H}px`);
  const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); const n = t.content.firstElementChild; document.body.append(n); return n; };
  const rnd = ((s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; })(20270101);
  const canvas = () => { const c = el(`<canvas width="${W}" height="${H}" class="full"></canvas>`); return c.getContext('2d'); };
  const glow = (g, x, y, r, rgb, a) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  };
  // 휴대폰 틀 안에 실제 페이지를 띄운다 (cw×ch 크기로 그리고 scale만큼 줄임)
  const phone = (src, x, y, scale, cw = 390, ch = 844) => el(`<div class="phone" style="left:${x}px;top:${y}px"><div class="scr" style="width:${cw * scale}px;height:${ch * scale}px"><iframe src="${src}" style="width:${cw}px;height:${ch}px;transform:scale(${scale})"></iframe></div></div>`);
  const browser = (src, x, y, w, h, cw) => { const s = w / cw; return el(`<div class="browser" style="left:${x}px;top:${y}px;width:${w}px"><div class="top"><i></i><i></i><i></i><b></b></div><div style="width:${w}px;height:${h - 38}px;overflow:hidden"><iframe src="${src}" style="width:${cw}px;height:${(h - 38) / s}px;transform:scale(${s})"></iframe></div></div>`); };

  const scenes = {
    // 기본 배경: 아이콘이 떠다니는 우주 (사진 없이 그림)
    default() {
      const g = canvas();
      g.fillStyle = '#04050b'; g.fillRect(0, 0, W, H);
      const m = Math.max(W, H);
      glow(g, W * 0.18, H * 0.22, m * 0.55, '47,107,255', 0.26);
      glow(g, W * 0.86, H * 0.82, m * 0.5, '255,79,174', 0.18);
      glow(g, W * 0.56, H * 0.48, m * 0.32, '124,77,255', 0.12);
      glow(g, W * 0.05, H * 0.95, m * 0.35, '34,192,109', 0.07);
      // 은하수 띠: 대각선을 따라 흐린 먼지
      for (let i = 0; i < 2600; i += 1) {
        const t = rnd();
        const off = (rnd() + rnd() + rnd() - 1.5) * m * 0.12;
        const x = -W * 0.1 + t * W * 1.2 + off * 0.45;
        const y = H * 0.95 - t * H * 0.9 + off;
        g.fillStyle = `rgba(200,210,255,${0.03 + rnd() * 0.08})`;
        g.fillRect(x, y, 1.2, 1.2);
      }
      // 별
      const count = Math.round(W * H / 1500);
      for (let i = 0; i < count; i += 1) {
        const x = rnd() * W; const y = rnd() * H;
        const big = rnd() < 0.06;
        const r = big ? 1 + rnd() * 1.2 : 0.35 + rnd() * 0.7;
        const tint = rnd();
        const rgb = tint < 0.15 ? '170,200,255' : tint < 0.25 ? '255,200,230' : '255,255,255';
        g.fillStyle = `rgba(${rgb},${big ? 0.85 : 0.25 + rnd() * 0.5})`;
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
        if (big && rnd() < 0.35) glow(g, x, y, r * 9, rgb, 0.18);
      }
      // 빛나는 별 몇 개 (십자 빛)
      for (const [fx, fy, s] of [[0.31, 0.16, 1], [0.71, 0.36, 0.8], [0.12, 0.62, 0.7], [0.9, 0.58, 0.9], [0.52, 0.86, 0.6]]) {
        const x = fx * W; const y = fy * H; const L = 26 * s;
        glow(g, x, y, 22 * s, '200,220,255', 0.35);
        g.strokeStyle = 'rgba(230,240,255,.7)'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(x - L, y); g.lineTo(x + L, y); g.moveTo(x, y - L); g.lineTo(x, y + L); g.stroke();
        g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, 1.8 * s, 0, Math.PI * 2); g.fill();
      }
      // 궤도선과 작은 행성
      g.save(); g.translate(W * 0.5, H * 0.52); g.rotate(-0.22);
      g.strokeStyle = 'rgba(160,180,255,.07)'; g.lineWidth = 1.2;
      for (const k of [0.42, 0.62]) { g.beginPath(); g.ellipse(0, 0, m * k, m * k * 0.3, 0, 0, Math.PI * 2); g.stroke(); }
      g.restore();
      const px = TALL ? W * 0.8 : W * 0.88; const py = TALL ? H * 0.12 : H * 0.17; const pr = TALL ? 34 : 42;
      glow(g, px, py, pr * 3.2, '120,150,255', 0.2);
      const pg = g.createLinearGradient(px - pr, py - pr, px + pr, py + pr);
      pg.addColorStop(0, '#9fb6ff'); pg.addColorStop(0.55, '#4a5fd8'); pg.addColorStop(1, '#151a40');
      g.fillStyle = pg; g.beginPath(); g.arc(px, py, pr, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(210,220,255,.55)'; g.lineWidth = 2;
      g.beginPath(); g.ellipse(px, py, pr * 1.9, pr * 0.42, -0.35, Math.PI * 1.04, Math.PI * 1.96 + Math.PI); g.stroke();
      // 가장자리를 어둡게
      const v = g.createRadialGradient(W / 2, H / 2, m * 0.25, W / 2, H / 2, m * 0.75);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
      g.fillStyle = v; g.fillRect(0, 0, W, H);
    },
    // Games 폴더: 게임 표지 세 장
    games() {
      const g = canvas();
      g.fillStyle = '#06070d'; g.fillRect(0, 0, W, H);
      glow(g, W * 0.3, H * 0.4, W * 0.6, '47,107,255', 0.25);
      glow(g, W * 0.75, H * 0.65, W * 0.6, '255,79,174', 0.18);
      const names = ['blocks', 'game', 'merge'];
      if (!TALL) {
        names.forEach((n, i) => {
          const w = 400; const h = 600; const x = W / 2 - w / 2 + (i - 1) * 450; const y = H / 2 - h / 2 + (i === 1 ? -14 : 22);
          el(`<img class="card" src="/${n}/assets/store/cover-800x1200.png" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${(i - 1) * 5}deg)">`);
        });
      } else {
        names.forEach((n, i) => {
          const w = 600; const h = 338; const x = W / 2 - w / 2 + (i - 1) * 18; const y = H / 2 - h / 2 + (i - 1) * 380;
          el(`<img class="card" src="/${n}/assets/store/cover-1920x1080.png" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${(i - 1) * -3}deg)">`);
        });
      }
    },
    swarm() { el(`<img class="full" src="/game/assets/store/${TALL ? 'cover-800x1200' : 'cover-1920x1080'}.png">`); },
    boss() { el('<img class="full" src="/game/assets/store/screenshot-2.png" style="object-position:62% 50%">'); },
    // 머니셈: 실제 계산기 화면 (PC 창 + 휴대폰)
    money() {
      document.body.style.background = 'radial-gradient(120% 90% at 30% 20%, #f4fdf8, #d8f3e4)';
      if (!TALL) {
        browser('/money/salary.html', 150, 110, 1060, 700, 1280);
        phone('/money/salary.html', 1100, 120, 0.78);
      } else {
        phone('/money/salary.html', (W - 520 - 24) / 2, (H - 1125 - 24) / 2, 520 / 390);
      }
    },
    // 토스 미니앱 두 개
    apps() {
      document.body.style.background = 'radial-gradient(90% 70% at 50% 40%, #ffffff, #e9edf2)';
      const sc = TALL ? 0.8 : 0.9;
      const pw = 390 * sc + 24; const ph = 844 * sc + 24; const gap = TALL ? 22 : 70;
      const x0 = (W - pw * 2 - gap) / 2; const y0 = (H - ph) / 2;
      phone('/toss-apps/apps/salary/dist/index.html', x0, y0 + (TALL ? 0 : 20), sc);
      phone('/toss-apps/apps/fortune/dist/index.html', x0 + pw + gap, y0 - (TALL ? 0 : 20), sc);
    },
    // 2027 플래너 미리보기: 표지 + 1월 달력
    planner() {
      document.body.style.background = 'radial-gradient(100% 80% at 40% 30%, #fffaf2, #efe6d8)';
      const bands = ['#ff8fb8', '#7dd3a7', '#ffd166', '#5ab4ff', '#2f2f36'];
      const cover = (x, y, w, h) => el(`<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:10px 18px 18px 10px;overflow:hidden;box-shadow:0 30px 70px rgba(80,60,30,.25);display:grid;grid-template-rows:1.3fr 1fr 1fr 1fr 1fr">${bands.map((c, i) => `<div style="background:${c};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;letter-spacing:.04em;font-size:${i ? 0 : w * 0.2}px">${i ? '' : '2027'}</div>`).join('')}</div>`);
      const cal = (x, y, w, h) => {
        const first = new Date(2027, 0, 1).getDay();
        const cells = [];
        for (let i = 0; i < 42; i += 1) { const d = i - first + 1; cells.push(d >= 1 && d <= 31 ? d : ''); }
        const fs = w / 34;
        return el(`<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:#fff;border-radius:16px;box-shadow:0 30px 70px rgba(80,60,30,.18);padding:${fs * 1.6}px;display:flex;flex-direction:column;gap:${fs * 0.7}px;color:#2f2f36">
          <div style="display:flex;align-items:baseline;gap:${fs * 0.6}px"><b style="font-size:${fs * 2.4}px;font-weight:900">1월</b><span style="font-size:${fs}px;color:#a1a1aa">JANUARY 2027</span><i style="margin-left:auto;width:${fs * 4}px;height:${fs * 0.7}px;border-radius:9px;background:#ff8fb8"></i></div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);font-size:${fs * 0.8}px;color:#a1a1aa;font-weight:700">${['일', '월', '화', '수', '목', '금', '토'].map((d) => `<span>${d}</span>`).join('')}</div>
          <div style="flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);border-top:2px solid #2f2f36">${cells.map((d, i) => `<span style="border-bottom:1px solid #eee;padding:${fs * 0.3}px;font-size:${fs * 0.85}px;font-weight:700;color:${i % 7 === 0 ? '#ff5f7e' : '#2f2f36'}">${d}${d === 1 ? `<i style="display:block;margin-top:${fs * 0.3}px;height:${fs * 0.55}px;border-radius:4px;background:#ffd166"></i>` : ''}${d === 15 ? `<i style="display:block;margin-top:${fs * 0.3}px;height:${fs * 0.55}px;border-radius:4px;background:#7dd3a7"></i>` : ''}</span>`).join('')}</div>
        </div>`);
      };
      if (!TALL) { cover(250, 170, 420, 560); cal(730, 150, 640, 600); } else { cover(180, 110, 360, 480); cal(60, 640, 600, 540); }
    },
    // 의뢰하기: 크몽 포트폴리오 샘플
    work() {
      const g = canvas();
      g.fillStyle = '#17130f'; g.fillRect(0, 0, W, H);
      glow(g, W * 0.5, H * 0.45, Math.max(W, H) * 0.6, '255,200,120', 0.16);
      const names = ['cafe', 'pilates', 'interior'];
      names.forEach((n, i) => {
        const s = TALL ? 430 : 470;
        const x = TALL ? W / 2 - s / 2 + (i - 1) * 90 : W / 2 - s / 2 + (i - 1) * 500;
        const y = TALL ? H / 2 - s / 2 + (i - 1) * 380 : H / 2 - s / 2 + (i === 1 ? -16 : 18);
        el(`<img class="card" src="/freelance/kmong/images/portfolio-${n}.jpg" style="position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px;transform:rotate(${(i - 1) * 4}deg)">`);
      });
    },
    // NOVA! 스티커: 분홍 무늬
    nova() {
      document.body.style.background = 'linear-gradient(160deg, #ffb3dc, #ff4fae 60%, #e02f8c)';
      const tile = (fs) => `<span style="display:inline-block;margin:${fs * 0.25}px ${fs * 0.4}px;font-size:${fs}px;font-weight:900;color:rgba(255,255,255,.16);-webkit-text-stroke:2px rgba(255,255,255,.45);letter-spacing:-1px">NOVA!</span>`;
      el(`<div style="position:absolute;left:-30%;top:-30%;width:160%;height:160%;transform:rotate(-14deg);line-height:1;text-align:center;overflow:hidden">${Array.from({ length: 16 }, (_, r) => `<div style="white-space:nowrap;margin-left:${(r % 2) * -90}px">${tile(78).repeat(14)}</div>`).join('')}</div>`);
      el(`<div class="center"><svg viewBox="0 0 220 110" style="width:${TALL ? 640 : 900}px;filter:drop-shadow(0 30px 60px rgba(120,0,60,.35))"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0f1"/><stop offset="1" stop-color="#ff7cc4"/></linearGradient></defs><text x="110" y="78" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,sans-serif" font-weight="900" font-size="74" fill="url(#sg)" stroke="#fff" stroke-width="10" paint-order="stroke" letter-spacing="-2">NOVA!</text><path d="M188 18l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#fff"/><circle cx="26" cy="24" r="4" fill="#fff"/></svg></div>`);
    },
  };
  // 띠별 운세는 결과 화면이 보이도록 띠를 미리 골라 둔다 (같은 주소라 저장소를 같이 씀)
  try { localStorage.setItem('daily-fortune:local:animal', '3'); } catch { /* 무시 */ }
  scenes[K]();
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  await Promise.all([...document.querySelectorAll('iframe')].map((f) => new Promise((r) => { f.addEventListener('load', r, { once: true }); setTimeout(r, 6000); })));
  await new Promise((r) => setTimeout(r, document.querySelector('iframe') ? 900 : 100));
  window.READY = true;
})();
</script>
</body>
</html>
